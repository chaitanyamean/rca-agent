[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-agent"
version = "0.1.0"
description = "AI Production Incident Root Cause Analysis platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RCA Agent Contributors" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Memory layer
    "neo4j>=5.20.0",
    "numpy>=1.26.0",
    # Agent / LLM
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Production hardening
    "slowapi>=0.1.9",
    "tenacity>=8.3.0",
    # HTTP client (used by JaegerTraceProvider and integration tests)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Real LLM providers — install with: pip install "rca-agent[llm]"
llm = [
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # tiktoken for accurate token counting (used by langchain-openai automatically)
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=0.28.0",         # TestClient transport (httpx2 replaces httpx for starlette)
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
rca-agent = "rca_agent.main:run"

# ---------------------------------------------------------------------------
# setuptools — src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
ignore = ["B008"]  # FastAPI Depends() in default args is intentional

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rca_agent"]
strict = true
ignore_missing_imports = true
