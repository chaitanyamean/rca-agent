version: "3.9"

services:
  rca-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rca-agent:local
    container_name: rca-agent
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: rca-agent
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    env_file:
      - path: .env
        required: false   # allow running without a .env file
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
